---
- name: Installer les dépendances Python
  yum:
    name:
      - python3
      - python3-pip
    state: present

- name: Créer le répertoire de l'application
  file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Copier l'application Flask
  copy:
    src: app.py
    dest: "{{ app_directory }}/app.py"
  notify: Restart API

- name: Déployer le service systemd
  template:
    src: api.service.j2
    dest: /etc/systemd/system/flask-api.service
  notify: Restart API

- name: Installer les requirements Python
  pip:
    requirements: "{{ app_directory }}/requirements.txt"
    executable: pip3

- name: Activer et démarrer le service
  systemd:
    name: flask-api
    state: started
    enabled: yes
    daemon_reload: yes

- name: Ouvrir le port dans le firewall
  firewalld:
    port: "{{ app_port }}/tcp"
    permanent: yes
    state: enabled
  when: ansible_distribution != "Amazon"
  ignore_errors: yes
