---
- name: Configure web servers (generic)
hosts: webservers
become: true
gather_facts: true


tasks:
- name: Ensure web root owner and permissions
file:
path: "{{ web_root }}"
owner: root
group: root
mode: '0755'


- name: Deploy systemd service (optional educational example)
template:
src: templates/service.j2
dest: /etc/systemd/system/simple-web-{{ inventory_hostname }}.service
owner: root
group: root
mode: '0644'
notify: Reload systemd


- name: Ensure systemd service is enabled and started (if present)
systemd:
name: "simple-web-{{ inventory_hostname }}.service"
enabled: yes
state: started
when: ansible_facts['os_family'] is defined


handlers:
- name: Reload systemd
command: systemctl daemon-reload
become: true